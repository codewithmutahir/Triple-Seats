name: Deploy API to Hostinger

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Hostinger website domain
        required: true
        default: lightcyan-kingfisher-777374.hostingersite.com
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create API archive
        run: node scripts/hostinger-api-archive.mjs

      - name: Deploy to Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: node scripts/hostinger-deploy-from-archive.mjs "${{ inputs.domain }}"

      - name: Verify /api/meta
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/meta.json -w "%{http_code}" \
              "https://${{ inputs.domain }}/api/meta" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              cat /tmp/meta.json
              exit 0
            fi
            sleep 15
          done
          echo "Warning: /api/meta not yet returning 200 (CDN may need a minute)."
          exit 0
